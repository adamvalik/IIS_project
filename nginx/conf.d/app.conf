server {
    listen 80;
    server_name djkhaled-animal-shelter.switzerlandnorth.cloudapp.azure.com;

    # Serve ACME challenge files for Let's Encrypt
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name djkhaled-animal-shelter.switzerlandnorth.cloudapp.azure.com;

    ssl_certificate     /etc/letsencrypt/live/djkhaled-animal-shelter.switzerlandnorth.cloudapp.azure.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/djkhaled-animal-shelter.switzerlandnorth.cloudapp.azure.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Proxy all traffic to the inner web-app nginx
    # That nginx handles SPA serving and /api → backend proxying
    location / {
        proxy_pass         http://web-app:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    container_name: backend
    # Port 8000 is NOT exposed to the host — nginx proxies /api internally
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql+psycopg2://user:satek123@10.0.1.4:5432/animal_shelter_db
    restart: always
    networks:
      - app_network

  web-app:
    build:
      context: ./web-app
      dockerfile: Dockerfile
    container_name: web-app
    # Internal only — outer nginx proxies to this container
    expose:
      - "80"
    restart: always
    networks:
      - app_network

  nginx:
    image: nginx:stable-alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    depends_on:
      - web-app
      - backend
    restart: always
    networks:
      - app_network

  certbot:
    image: certbot/certbot
    container_name: certbot
    volumes:
      - ./certbot/www:/var/www/certbot
      - ./certbot/conf:/etc/letsencrypt
    # Auto-renew every 12 hours
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
